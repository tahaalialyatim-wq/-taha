name: android-apk

on:
  push:
    branches: [main]
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/awtad_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install SQLite for widget/unit tests
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - name: Materialize missing Android wrapper files
        run: |
          flutter create --platforms=android .
          git checkout -- .
          test ! -e test/widget_test.dart || mv test/widget_test.dart /tmp/flutter-create-widget-test.dart
      - run: chmod +x android/gradlew
      - run: flutter test
      - run: flutter build apk --release
      - name: Copy APK to repository root
        working-directory: .
        run: |
          test -f apps/awtad_mobile/build/app/outputs/flutter-apk/app-release.apk
          cp apps/awtad_mobile/build/app/outputs/flutter-apk/app-release.apk awtad-retail.apk
      - uses: actions/upload-artifact@v4
        with:
          name: awtad-retail-apk
          path: awtad-retail.apk
