name: android-apk

on:
  push:
    branches: [main]
  pull_request:

jobs:
  apk:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/awtad_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install native build deps
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev cmake ninja-build
      - run: flutter pub get
      - name: Generate a complete Android host
        run: |
          rm -rf android
          flutter create --platforms=android --org com.awtad --project-name awtad_mobile .
          git checkout -- lib test pubspec.yaml analysis_options.yaml README.md .gitignore
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          text = text.replace('android:label="awtad_mobile"', 'android:label="الأوتاد للمبيعات"')
          if "android:supportsRtl" not in text:
              text = text.replace("<application", '<application android:supportsRtl="true"', 1)
          manifest.write_text(text, encoding="utf-8")
          PY
          chmod +x android/gradlew
      - run: yes | flutter doctor --android-licenses || true
      - run: flutter test
      - run: flutter build apk --release
      - name: Copy APK to repository root
        working-directory: .
        run: |
          test -f apps/awtad_mobile/build/app/outputs/flutter-apk/app-release.apk
          cp apps/awtad_mobile/build/app/outputs/flutter-apk/app-release.apk awtad-retail.apk
      - uses: actions/upload-artifact@v4
        with:
          name: awtad-retail-apk
          path: awtad-retail.apk
